  - id: AT-V2-002-03
    required_assertion: 旧档案不会被当作当前规范自动加载；显式核对工具上下文入口和实际配置引用，不能仅凭目录名称推断自动加载
  - id: AT-V2-002-04
    required_assertion: 外部来源/采纳项/任务/场景双向可定位；悬空来源、错误场景归属和无证据 VERIFIED 被拒绝
