acceptance_criteria:
  AT-V2-017-01:
    title: "Initial chapter contract compilation from SeriesVision"
    requirement: "First chapter compiles with no prior chapter, binds Canon parent and GenrePack"

  AT-V2-017-02:
    title: "Subsequent chapter binds prior chapter actual end state"
    requirement: "Chapter N contract binds chapter N-1 prose hash and actual end evidence"

  AT-V2-017-03:
    title: "Prior chapter revision invalidates dependent contracts"
    requirement: "Modifying chapter N prose invalidates chapter N+1 contract, triggers replan proposal"

  AT-V2-017-04:
    title: "Resource and character state constraints enforced"
    requirement: "Contract rejects transitions violating resource limits or character knowledge boundaries"

  AT-V2-017-05:
    title: "Knowledge boundaries and revelation timing validated"
    requirement: "Contract enforces who-knows-what, prevents premature secret revelation"

  AT-V2-017-06:
    title: "Version expiry and unsatisfiable condition diagnostics"
    requirement: "Expired plan versions and impossible transitions return diagnostic, not silent failure"

  AT-V2-017-07:
    title: "Canon/Pack/Plan changes trigger scoped invalidation"
    requirement: "Changes invalidate only affected contracts, generate replan proposals"

  AT-V2-017-08:
    title: "Quiet chapters and character growth not falsely rejected"
    requirement: "Chapters with introspection, preparation, or natural progression compile successfully"

verification_requirements:
  - All 8 AT tests implemented and passing
  - Tests run without V2-019 Model Gateway (local contract validation)
  - Canon remains read-only (no write path created)
  - NarrativeDelta semantics reused from V2-008
  - Contract Compiler cannot modify Canon
  - Proper diagnostic messages for contract violations
  - ReplanProposal generation on invalidation

implementation_scope:
  in_scope:
    - SeriesVision, ArcPlan, ChapterPlan, ScenePlan models
    - PlanVersion with freeze_horizon and supersession
    - ChapterContract with RequiredTransition
    - Contract compilation logic binding Canon parent, GenrePack, prior chapter evidence
    - Invalidation scope rules per ADR-008
    - ReplanProposal generation
    - Contract diagnostic messages

  out_of_scope:
    - V2-018 Context Compiler
    - V2-019 Model Gateway
    - V2-020+ Validators, Delta Extractor, Workflow
    - Multi-entry Genesis system
    - Author rich-text workbench
    - Paid novel generation calls

