    character_b: elder_zhao
    relationship_type: transaction_negotiation
    trust_level: low
    conflict_potential: high
    description: "商业谈判关系，赵长老掌握资源和信息优势"

  world_boundaries:
  cultivation_constraints:
    - "筑基需要筑基丹或特殊机缘"
    - "炼气至筑基是第一道大坎，失败可能道基受损"
    - "道韵需达到20以上才有筑基资格"
    - "资源有限，灵石和丹药需要明确来源"
    - "筑基丹用于疗伤：可修复破损经脉，但无法降低筑基所需的道韵门槛"
    - "灵石兑换：1块中品灵石=10块下品灵石"

  progression_rules:
    - "修为进阶必须按炼气→筑基→结丹→元婴→化神顺序"
    - "跨境界战斗极其困难"
    - "能力使用消耗灵力，需要恢复时间"

  world_mechanics:
    - "商会、拍卖、灵石交易是合法修真界制度"
    - "契约一旦签订具有法力约束"
    - "宗门和散修存在实力和资源差距"

  prohibited_mechanisms:
    - "现代股份制公司结构"
    - "证券市场和IPO"
    - "现代金融衍生品"

  allowed_fantasy_elements:
    - "灵石货币体系"
    - "商会和拍卖行"
    - "修真资源交易"
    - "宗门贡献点系统"

  protagonist_goal:
  primary: "在3个月内解决筑基和救治柳梦的两难困境"
  constraints:
    - "只有1枚筑基丹，无法同时用于突破和治疗"
    - "天心草价值200块中品灵石（约2000块下品灵石），目前无法支付"
    - "时间紧迫：柳梦伤势每月恶化，3个月后不可逆"
  success_criteria:
    - "王林成功筑基或保留筑基机会"
    - "柳梦伤势得到有效治疗"
    - "不签订过于苛刻的长期契约"

conflict_engine:
  core_dilemma: "自身突破 vs 救治道侣 vs 保持自由"
  escalation_mechanism:
    - stage: initial
      trigger: "柳梦走火入魔，需要筑基丹"
      pressure: "唯一筑基丹面临两种用途"
    - stage: intensified
      trigger: "天宝商会提出护卫契约，可获得天心草和筑基丹"
      pressure: "三年自由vs即刻解决资源困境"
    - stage: climax
      trigger: "柳梦伤势恶化，只剩1个月窗口期"
      pressure: "必须立即决策，其他散修即将接受商会契约"

choice_costs:
  - choice: "自己使用筑基丹突破"
    immediate_gain: "70%概率成功筑基，实力大增"
    immediate_cost: "无法治疗柳梦，道侣可能经脉永久受损"
    delayed_consequences:
      - "柳梦修为废除，两人关系破裂"
      - "王林内疚和道心裂痕"
      - "筑基后面临更强对手，失去伙伴"

  - choice: "用筑基丹救治柳梦"
    immediate_gain: "柳梦经脉修复，伤势稳定，关系维系"
    immediate_cost: "失去唯一筑基机会，仍需2000块下品灵石（或200块中品灵石）购买天心草"
    delayed_consequences:
      - "继续停留炼气期，面临寿元压力（炼气期寿命120年，已25岁）"
      - "需要数年积累才能再获筑基丹"
      - "柳梦恢复后实力可能超过王林"

  - choice: "接受商会护卫契约"
    immediate_gain: "商会承诺提供天心草+额外筑基丹，签约后完成首次任务即可获得资源，两全其美"
    immediate_cost: "签订三年生死契约，丧失修炼自由"
    delayed_consequences:
      - "商会护卫任务危险，三年契约预计执行六次高危任务，单次任务条件死亡率约10.9%，累计生还率约50%"
      - "三年内无法自主选择修炼方向"
      - "契约可能包含隐藏条款（残缺功法归商会研究）"

  - choice: "寻找第三条路（秘境探索/其他交易）"
    immediate_gain: "保持自由和筑基机会"
    immediate_cost: "时间紧迫，风险极高，成功率未知"
    delayed_consequences:
      - "可能错过所有机会"
      - "秘境探索可能遇到更强敌人"
      - "柳梦伤势恶化到不可逆程度"

opponent_adaptation:
  - trigger: "王林试图寻找其他资源渠道"
    zhao_response: "降低契约年限至两年，但增加功法研究条款"
    market_response: "其他散修竞争同一批资源，价格上涨"

  - trigger: "王林提出修改契约条款"
    zhao_response: "同意部分修改，但坚持生死战条款不可删除"
    liu_meng_response: "暗中联系其他商会，但条件更苛刻"

