scope: |
  V2-014 Genre Hard Policy Engine: Implements world rule judgment for structured narrative candidates.

  Delivers real, executable genre policy engine that:
  - Distinguishes actual world facts from dialogue, dreams, metaphors, speculation
  - Returns explicit verdicts: ALLOW, REJECT, REVIEW_REQUIRED
  - Enforces urban.business.realistic (no supernatural) vs fantasy.eastern.progression (cultivation allowed)
  - Rejects optional strategies conflicting with frozen Pack mechanics
  - Preserves Pack identity (no automatic fallback)

  Implemented:
  - src/anovel/genre/policy.py: GenreHardPolicyEngine with dual-anchor enforcement
  - tests/contract/test_v2_014.py: 27 contract tests covering all 4 AT scenarios
  - Updated src/anovel/genre/__init__.py: export policy classes

  Out of scope (correctly deferred):
  - Does NOT issue CommitPermits (CanonCommitService owns that)
  - Does NOT write to Canon directly
  - Does NOT replace Q2 quality gates
  - Does NOT claim general semantic understanding of free text
  - Full 30 GenrePack expansion (frozen to 2 Anchors for P3)
  - V2-015/016 extension-specific schemas

