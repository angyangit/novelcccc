        - "柳梦道基崩溃需天心草稳定，经脉破损需筑基丹修复，两者缺一不可"
        - "天宝商会护卫契约包含生死战任务"
        - "商会承诺的资源需在签订契约并完成首次任务后交付"
      goals:
