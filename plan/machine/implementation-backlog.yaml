  dependencies: []
  acceptance_criteria:
  - 任务阶段与生成视图一致且失效引用失败
  - 无证据 CLOSED 与未满足 Gate 的任务启动被拒绝
  - 旧档案不会被当作当前规范自动加载；显式核对工具上下文入口和实际配置引用，不能仅凭目录名称推断自动加载
  - 外部来源/采纳项/任务/场景双向可定位；悬空来源、错误场景归属和无证据 VERIFIED 被拒绝
  - CI 必需集合与最晚启用阶段、里程碑最低义务不可静默删减，已验证阶段聚合真实适用证据
  - 不存在文件、目录、README 或未接受 ADR 模板冒充类型化证据均被拒绝；证据的类型归属版本与 hash 一致
  - readiness、P0 entry 和 ADR/finding 双向关系受校验；任务 CLOSED 必须逐项处置关联 finding
  - 治理回归包含合格完成链正例及单点负例；深层失败不能被更早的无效夹具掩盖
  - 仅 PASS 的 plan_execution_evidence 用于放行见证，失败/UNKNOWN 原始执行记录独立保留且不得冒充完成证据
  - 校验产物可输出到 plan 外的独立目录（如项目内 dist/validation）；该模式不回写被测计划，已提交 JSON 不视为当前提交认证
  - 模板 Artifact 按解析后路径判定；相对路径别名与符号链接不能冒充执行结果，合法产物不被误拒绝
  - 里程碑与其阶段决定及阶段适用 CI 绑定同一被核验 revision，同时允许保留适用的历史任务证据
  - 任务从 OPEN 进入执行须引用具体 task_execution_packet；缺失、模板、错误任务/规范/输入 hash 或过期上下文被拒绝，合格执行包按 PREPARE/IMPLEMENT/LIVE_CALL/CERTIFY 动作通过对应检查；本地资料通过不代替
    runner 开工拦截
  - 动作前核对所需 ADR 与授权：PREPARE 可调查未决项但不执行受其约束的实现，IMPLEMENT/LIVE_CALL/CERTIFY 到达决定点时未接受 ADR 被拒绝，已接受且适用的决定允许继续；必要付费上限缺失时不得调用
  - 执行判断显式区分 FACT/ASSUMPTION/UNKNOWN 与独立 ADR 决定 并绑定依据；阻断当前动作的未知项或无依据事实不得被猜测成已解决，已核实事项和不影响当前动作的明确假设可按范围继续
  - 恢复执行须核对交接记录、仓库与工作区、规范/输入快照、实际测试产物和未决事项；缺失交接或失效证据不得继承完成结论，合格恢复可继续原任务，不因摘要或模型更换静默重开或越过 Gate
