- task_id: V2-006
  title: Entity Relationship Tracking
  phase: P1
  priority: P0
  goal: Stable, directed, project-scoped entity relationship tracking without persistence coupling
  normative_specs:
  - 03_DOMAIN_CANON_AND_ARTIFACT_CONTRACTS.md
  - docs/V2-006_IMPLEMENTATION_CONTRACT.md
  - AI_EXECUTION_PROTOCOL.md
  dependencies:
  - V2-005
  acceptance_criteria:
  - Stable UUID v4 relationship identity (RelationshipId)
  - Directed relationships (no automatic inverse)
  - Project isolation (relationships scoped to ProjectId)
  - Semantic tuple uniqueness (different ID + same live tuple → ValueError)
  - Same-ID same-content replay is no-op
  - Same-ID conflicting-content raises ValueError
  - Delete releases semantic tuple for reuse
  - No persistence coupling (no database/ORM imports)
  - No provider coupling (no LLM provider imports)
  - Immutable EntityRelationship (frozen dataclass)
  - Extensible RelationshipType (string-based, not enum)
  - Create/delete/query operations complete
