rationale: |
  The ANovelOS Owner explicitly accepted ADR-007 for approved candidate PR #4 HEAD acff54b0e8e40396d42fae5f723667cb525aa7aa.

  Decision scope: GenrePack identity (pack_id, version, content_hash) with three-way consistency verification,
  extension namespace isolation with explicit rejection semantics, project binding with frozen Pack versions,
  and two frozen Anchors (urban.business.realistic, fantasy.eastern.progression).

  Final technical constraints added:
  - extension_namespaces ↔ extension_schemas strict consistency (load failure on mismatch)
  - world_anchors ↔ pack_id strict correspondence for P3 (load failure on mismatch)
  - Future configuration independence must add to normalized hash or use equivalent deterministic binding

  Acceptance establishes the V2-013 implementation contract. V2-013 IMPLEMENT remains separately Owner-controlled
  and is not authorized by this ADR acceptance.
