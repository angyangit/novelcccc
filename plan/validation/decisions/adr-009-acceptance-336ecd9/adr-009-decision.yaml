decision: ACCEPTED
rationale: |
  The ANovelOS Owner explicitly accepted ADR-009 Context Compilation and Budget Policy with five mandatory amendments.

  Core decisions approved:
  1. Mandatory Context Definition - ContinuityConstraint, ChapterContract constraints, character knowledge boundaries, GenrePack hard policies, Canon required facts (never trimmed)
  2. Optional Context Definition - retrieval summaries, background extensions, style references (budget-trimmable)
  3. Mandatory Overflow Strategy - FAIL_FAST with explicit ContextCompilationError (no silent truncation, no auto budget increase, no mandatory summarization)
  4. Optional Budget Allocation - ADAPTIVE selection by causal dependency, chapter needs, temporal relevance, information importance (not fixed priority ordering)
  5. Knowledge Isolation - STRICT scope and visibility enforcement (reviewer materials never enter Writer context, future chapter facts excluded, scope isolation by project_id)
  6. Explainability and Auditability - deterministic offline compilation with full provenance tracking (source hash, visibility, mandatory flag, inclusion reason, token counting method)

  Owner amendments integrated:
  1. Chapter 1 continuity handling - explicit "no previous chapter" for first chapter, continuity constraint priority preservation
  2. Dynamic optional priority - adaptive evaluation based on actual ChapterContract content, not fixed ordering rules
  3. Model-specific tokenizer - target model compatible tokenizer required, cl100k_base not universal default
  4. Explicit budget failure - error when mandatory content cannot be reliably proven within budget
  5. Output reserve accounting - reserve tokens for Writer output, system messages, and protocol overhead

  Acceptance establishes V2-018 IMPLEMENT architectural contract. V2-018 IMPLEMENT conditionally authorized pending PR #17 merge and G-P4 VERIFIED.
