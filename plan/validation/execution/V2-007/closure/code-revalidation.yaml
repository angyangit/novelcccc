  - MappingProxyType backing alias prevention (defensive dict() copy before MappingProxyType)

  No forbidden dependencies:
  - No database imports (sqlalchemy, psycopg, alembic)
  - No Canon imports (anovel.canon.repository, anovel.canon.commit_service)
  - No Provider imports (anovel.provider)

  ADR-003 alignment:
  - Event.story_time supports PreciseTime | IntervalTime | RelativeTime
  - Timeline.events supports non-linear disclosure order
  - Promise distinct from Character Goal (separate module, different semantics)
  - Unknown occurrence ≠ occurred (resolve_event_occurrence returns None for missing/unresolved refs)

