notes: |
  此故事样本设计目标：
  1. 展示fantasy.eastern.progression Pack的修炼状态跟踪
  2. 体现境界、资源、代价的显式约束
  3. 主角面临修真世界真实困境，选择有代价
  4. 允许合法修真商业（商会、灵石交易）
  5. 拒绝现代公司制度污染
  6. 角色知识边界与秘密揭示有计划

  可验证状态转移：
  - 修为变化（炼气九层 → 筑基初期 or 停滞）
  - 资源变化（筑基丹1枚 → 0枚，灵石300 → 100 → ?）
  - 道侣伤势（走火入魔 → 稳定 or 恶化）
  - 契约状态（自由 → 三年契约束缚）
  - 关系变化（道侣trust: high → ? 基于选择）

  为V2-017 Contract Compiler准备的信息：
  - 主角目标有多重约束和冲突
  - 关键决策有明确前置条件（资源、时间、修为）
  - 状态变化可追溯到具体选择
  - 知识边界和秘密可编译为Contract约束
  - 修真世界规则（境界序列、资源成本）可形式化
