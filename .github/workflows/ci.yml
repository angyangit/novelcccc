name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.12.14
  UV_VERSION: 0.12.17
  POSTGRES_DB: bootstrap_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_test_password_not_real
  ANOVELOS_TEST_DSN: postgresql+psycopg://postgres:ci_test_password_not_real@localhost:5432/bootstrap_test

jobs:
  static:
    name: STATIC
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          pip install uv==${{ env.UV_VERSION }}
          uv --version

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run format check
        run: |
          echo "=== STATIC Gate ==="
          echo "Format check..."
          uv run ruff format --check plan/scripts/ src/

      - name: Run lint check
        run: |
          echo "Lint check..."
          uv run ruff check plan/scripts/ src/

      - name: Run type check
        run: |
          echo "Type check..."
          uv run mypy plan/scripts/ src/ --ignore-missing-imports --no-strict-optional

      - name: STATIC gate result
        run: echo "STATIC gate PASS"

  schema_contract:
    name: SCHEMA_CONTRACT
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          pip install uv==${{ env.UV_VERSION }}
          uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run plan validation
        run: |
          echo "=== SCHEMA_CONTRACT Gate ==="
          mkdir -p dist/ci/schema
          uv run python plan/scripts/validate_plan.py --check --output-dir dist/ci/schema

      - name: Check canonical authority
        run: |
          echo "Canonical authority check..."
          uv run python plan/scripts/check_canonical_authority.py

      - name: Run governance tests
        run: |
          uv run pytest tests/contract/test_plan_governance.py -v --tb=short

      - name: Validate CommitReceipt JSON Schema
        run: |
          uv run pytest tests/integration/test_commit_receipt_schema.py -v --tb=short

      - name: SCHEMA_CONTRACT gate result
        run: echo "SCHEMA_CONTRACT gate PASS"

  unit:
    name: UNIT
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          pip install uv==${{ env.UV_VERSION }}
          uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: |
          echo "=== UNIT Gate ==="
          uv run pytest tests/architecture/ tests/contract/ -v --tb=short --junitxml=dist/ci/unit/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: dist/ci/unit/

  arch_fitness:
    name: ARCH_FITNESS
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          pip install uv==${{ env.UV_VERSION }}
          uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run architecture fitness tests
        run: |
          echo "=== ARCH_FITNESS Gate ==="
          uv run pytest tests/architecture/test_dependency_boundaries.py tests/architecture/test_change_review.py tests/architecture/test_weakening_checks.py -v --tb=short --junitxml=dist/ci/arch/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-test-results
          path: dist/ci/arch/

  postgres_env:
    name: POSTGRES_ENV
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_DB: bootstrap_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_not_real
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          pip install uv==${{ env.UV_VERSION }}
          uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for PostgreSQL
        run: |
          echo "=== POSTGRES_ENV Gate ==="
          echo "Waiting for PostgreSQL to be ready..."
          sleep 5

      - name: Check PostgreSQL connection
        run: |
          uv run python scripts/check_postgres.py

      - name: Run PostgreSQL integration tests
        run: |
          uv run pytest tests/integration/test_postgres_ci_service.py -v --tb=short

      - name: Run Alembic migrations
        run: |
          echo "Running Alembic migrations..."
          uv run alembic upgrade head

      - name: Run V2-009 Canon persistence tests
        run: |
          echo "Running V2-009 Canon persistence integration tests..."
          uv run pytest tests/integration/test_v2_009.py -v --tb=short

      - name: Run V2-010 CanonCommitService tests
        run: |
          echo "Running V2-010 CanonCommitService integration tests..."
          uv run pytest tests/integration/test_v2_010.py -v --tb=short

      - name: Run V2-010 acceptance supplement tests
        run: |
          echo "Running V2-010 acceptance supplement tests..."
          uv run pytest tests/integration/test_v2_010_acceptance_supplement.py -v --tb=short

      - name: Run V2-011 Canon Idempotency tests
        run: |
          echo "Running V2-011 Canon Idempotency and CAS tests..."
          uv run pytest tests/integration/test_v2_011.py -v --tb=short

      - name: Run V2-012 Canon Snapshot tests
        run: |
          echo "Running V2-012 Canon Snapshot and Projection tests..."
          uv run pytest tests/integration/test_v2_012.py -v --tb=short

      - name: Verify PostgreSQL transaction isolation
        run: |
          uv run pytest tests/integration/test_isolation_level.py -v --tb=short

      - name: Run environment security regression test
        run: |
          echo "Running environment security regression test..."
          uv run pytest tests/integration/test_postgres_environment.py::test_clean_environment_removes_postgres_bind_ip -v --tb=short

      - name: POSTGRES_ENV gate result
        run: echo "POSTGRES_ENV gate PASS"

  secret_dependency:
    name: SECRET_DEPENDENCY
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          pip install uv==${{ env.UV_VERSION }}
          uv --version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install gitleaks
        run: |
          echo "Installing gitleaks..."
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Run secret scanning
        run: |
          echo "=== SECRET_DEPENDENCY Gate ==="
          mkdir -p dist/ci/security
          echo "Secret scanning with gitleaks..."
          /tmp/gitleaks detect --config .gitleaks.toml --no-git --verbose --source . --report-format json --report-path dist/ci/security/gitleaks-report.json
          echo "Gitleaks scan PASS"

      - name: Run supplementary checks
        run: |
          echo "Supplementary grep-based checks..."
          if grep -r "ANOVELOS_.*SECRET" plan/ src/ scripts/ --include="*.py" --include="*.yaml" 2>/dev/null | grep -v "^#" | grep -v "tests/fixtures"; then
            echo "WARNING: Supplementary check found potential secrets"
            exit 1
          fi
          # Check for api_key assignments but exclude legitimate library calls and env reads
          if grep -r "api[_-]key.*=" plan/ src/ scripts/ --include="*.py" --include="*.yaml" 2>/dev/null | grep -v "^#" | grep -v "example" | grep -v "api_key=key" | grep -v "getenv" | grep -v "type: ignore"; then
            echo "WARNING: Supplementary check found potential API keys"
            exit 1
          fi
          echo "Supplementary checks PASS"

      - name: Check dependency integrity
        run: |
          echo "Dependency integrity check..."
          uv pip check

      - name: Run dependency audit
        run: |
          echo "Dependency vulnerability scan..."
          uv pip list --format=freeze > /tmp/requirements-all.txt
          sed '/^anovelos==/d' /tmp/requirements-all.txt > /tmp/requirements.txt
          if [ -s /tmp/requirements.txt ]; then
            uv run pip-audit --strict -r /tmp/requirements.txt
          else
            echo "No dependencies to audit"
          fi

      - name: SECRET_DEPENDENCY gate result
        run: echo "SECRET_DEPENDENCY gate PASS"

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: dist/ci/security/
