title: "逆天修仙：资源与抉择"
synopsis: |
  王林，一位散修，意外获得古修士洞府中的筑基丹和残缺功法。
  他目前处于炼气九层，只需一枚筑基丹即可尝试突破筑基期。
  但他的道侣柳梦因修炼走火入魔，急需天心草和筑基丹修复经脉。
  天宝商会长老提出交易：用筑基丹换取三年护卫契约。
  王林必须在自己突破、救治道侣和保持自由之间做出选择。

initial_facts:
  - fact_id: wang_realm
    description: "王林炼气九层，道韵15，距离筑基一步之遥"
    fact_type: cultivation_state
    story_time: "修真历2380年春"

  - fact_id: initial_resources
    description: "王林拥有筑基丹1枚，下品灵石300块，残缺功法《太玄真诀》"
    fact_type: resource_state
    story_time: "修真历2380年春"

  - fact_id: liu_injury
    description: "柳梦走火入魔导致道基崩溃，经脉受损，需要天心草稳定道基并配合筑基丹修复破损经脉"
    fact_type: character_condition
    story_time: "修真历2380年夏"

  - fact_id: tianbao_offer
    description: "天宝商会长老提出：王林以三年危险护卫服务为代价，商会承诺提供天心草及1枚额外筑基丹"
    fact_type: transaction_proposal
    story_time: "修真历2380年夏"

