# ANovelOS V2 CI Pipeline
# P0 Gates: STATIC, UNIT, SCHEMA_CONTRACT, ARCH_FITNESS, SECRET_DEPENDENCY, POSTGRES_ENV
# Version: 1.0.0
# Locked dependencies: uv.lock (uv sync --frozen)

workflow:
  rules:
    # MR pipeline takes precedence when MR exists
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    # Suppress duplicate branch pipeline when MR is open
    # Only suppress push events to avoid blocking scheduled/triggered pipelines
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never

    # Allow tag pipelines
    - if: '$CI_COMMIT_TAG'

    # Allow branch pipelines when no MR exists
    - if: '$CI_COMMIT_BRANCH'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  POSTGRES_DB: bootstrap_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_test_password_not_real
  ANOVELOS_TEST_DSN: postgresql+psycopg://postgres:ci_test_password_not_real@postgres:5432/bootstrap_test

stages:
  - validate
  - test
  - security

# Cache for dependencies
.cache_template: &cache_template
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/pip
      - .cache/uv
      - .venv

# Base job template
.base_job:
  image: python:3.12-bookworm
  before_script:
    - python --version
    - pip install uv==0.12.17
    - uv --version
    - uv sync --frozen
    - source .venv/bin/activate
  <<: *cache_template

# STATIC Gate - Format, Lint, Typecheck
static:
  extends: .base_job
  stage: validate
  allow_failure: false
  script:
    - echo "=== STATIC Gate ==="
    - echo "Using locked tools from uv.lock..."
    - echo "Format check..."
    - uv run --directory . ruff format --check plan/scripts/ src/
    - echo "Lint check..."
    - uv run --directory . ruff check plan/scripts/ src/
    - echo "Type check..."
    - uv run --directory . mypy plan/scripts/ src/ --ignore-missing-imports --no-strict-optional
    - echo "STATIC gate PASS"
  artifacts:
    when: always
    paths:
      - dist/ci/static/
    expire_in: 7 days
  after_script:
    - mkdir -p dist/ci/static
    - echo '{ "gate":"STATIC", "status":"completed", "commit":"'"$CI_COMMIT_SHA"'" }' > dist/ci/static/result.json

# UNIT Gate - Architecture + Contract Tests
unit:
  extends: .base_job
  stage: test
  allow_failure: false
  script:
    - echo "=== UNIT Gate ==="
    - pytest tests/architecture/ tests/contract/ -v --tb=short --junitxml=dist/ci/unit/junit.xml
  artifacts:
    when: always
    paths:
      - dist/ci/unit/
    reports:
      junit: dist/ci/unit/junit.xml
    expire_in: 7 days

# SCHEMA_CONTRACT Gate - Plan Validation
schema_contract:
  extends: .base_job
  stage: validate
  variables:
    GIT_DEPTH: "0"
  allow_failure: false
  script:
    - echo "=== SCHEMA_CONTRACT Gate ==="
    - mkdir -p dist/ci/schema
    - python plan/scripts/validate_plan.py --check --output-dir dist/ci/schema
    - python -m pytest tests/contract/test_plan_governance.py -v --tb=short
  artifacts:
    when: always
    paths:
      - dist/ci/schema/
    expire_in: 7 days

# ARCH_FITNESS Gate - Architecture Fitness Tests
arch_fitness:
  extends: .base_job
  stage: test
  allow_failure: false
  script:
    - echo "=== ARCH_FITNESS Gate ==="
    - pytest tests/architecture/test_dependency_boundaries.py tests/architecture/test_change_review.py tests/architecture/test_weakening_checks.py -v --tb=short --junitxml=dist/ci/arch/junit.xml
  artifacts:
    when: always
    paths:
      - dist/ci/arch/
    reports:
      junit: dist/ci/arch/junit.xml
    expire_in: 7 days

# SECRET_DEPENDENCY Gate - Security Scans (Fail-Closed)
secret_dependency:
  extends: .base_job
  stage: security
  allow_failure: false
  before_script:
    - python --version
    - pip install uv==0.12.17
    - uv --version
    - uv sync --frozen
    - source .venv/bin/activate
    # Install gitleaks for secret scanning
    - echo "Installing gitleaks..."
    - |
      GITLEAKS_VERSION="8.21.2"
      GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
      wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O /tmp/gitleaks.tar.gz
      echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
      tar -xzf /tmp/gitleaks.tar.gz -C /tmp
      chmod +x /tmp/gitleaks
      /tmp/gitleaks version
  script:
    - echo "=== SECRET_DEPENDENCY Gate ==="
    - echo "Preparing output directory..."
    - mkdir -p dist/ci/security
    - echo "Secret scanning with gitleaks (policy scanner)..."
    - /tmp/gitleaks detect --config .gitleaks.toml --no-git --verbose --source . --report-format json --report-path dist/ci/security/gitleaks-report.json
    - echo "Gitleaks scan PASS"
    - echo "Supplementary grep-based checks..."
    - |
      # Supplementary scan for production code patterns (not primary scanner)
      if grep -r "ANOVELOS_.*SECRET" plan/ src/ scripts/ --include="*.py" --include="*.yaml" 2>/dev/null | grep -v "^#" | grep -v "tests/fixtures"; then
        echo "WARNING: Supplementary check found potential secrets in production code"
        exit 1
      fi
      if grep -r "api[_-]key.*=" plan/ src/ scripts/ --include="*.py" --include="*.yaml" 2>/dev/null | grep -v "^#" | grep -v "example"; then
        echo "WARNING: Supplementary check found potential API keys"
        exit 1
      fi
    - echo "Supplementary checks PASS"
    - echo "Dependency integrity check..."
    - uv pip check
    - echo "Dependency vulnerability scan..."
    - uv pip list --format=freeze > /tmp/requirements-all.txt
    - sed '/^anovelos==/d' /tmp/requirements-all.txt > /tmp/requirements.txt
    - if [ -s /tmp/requirements.txt ]; then uv run pip-audit --strict -r /tmp/requirements.txt; else echo "No dependencies to audit"; fi
    - echo "SECRET_DEPENDENCY gate PASS"
  artifacts:
    when: always
    paths:
      - dist/ci/security/
    expire_in: 7 days
  after_script:
    - mkdir -p dist/ci/security
    - echo '{ "gate":"SECRET_DEPENDENCY", "status":"completed", "scanner":"gitleaks", "version":"8.21.2" }' > dist/ci/security/result.json

# POSTGRES_ENV Gate - Real PostgreSQL Connection
postgres_env:
  extends: .base_job
  stage: test
  allow_failure: false
  services:
    - name: postgres:17.0
      alias: postgres
  script:
    - echo "=== POSTGRES_ENV Gate ==="
    - echo "Waiting for PostgreSQL to be ready..."
    - sleep 5
    - python scripts/check_postgres.py
    - pytest tests/integration/test_postgres_ci_service.py -v --tb=short
  artifacts:
    when: always
    paths:
      - dist/ci/postgres/
    expire_in: 7 days
  after_script:
    - mkdir -p dist/ci/postgres
    - echo '{ "gate":"POSTGRES_ENV", "status":"completed", "service":"postgres:17.0" }' > dist/ci/postgres/result.json
