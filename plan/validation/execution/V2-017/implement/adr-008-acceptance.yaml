rationale: |
  The ANovelOS Owner explicitly accepted ADR-008 with AMEND: precise Invalidation Scope Rules added to Decision 4.

  Decision scope: Contract-Overlay Binding (Decision 1), Planning Version and Freeze Horizon (Decision 2),
  Supersession Semantics (Decision 3), Invalidation and Replanning with precise scope rules (Decision 4 AMENDED),
  Canon Write Prohibition (Decision 5).

  Five Invalidation Scope Rules added:
  1. Eager invalidation detection - immediate identification when inputs change, detection cannot defer
  2. Dependency-based scope - analyze full compilation input dependencies, not assumptions
  3. State boundaries - committed Canon (immutable) vs compiled contracts (invalidatable) vs uncompiled plans (adjustable)
  4. GenrePack compatibility proofs required - hash change requires explicit verification
  5. Invalidation audit trail - every InvalidationRecord documents trigger, dependencies, scope justification

  Amendment addresses precision gaps identified in Owner decision review: prevents stale contract usage,
  prevents excessive replanning cascade, maintains Canon integrity, enables 100+ chapter long-form fiction viability.

  Acceptance establishes V2-017 IMPLEMENT architectural contract. V2-017 IMPLEMENT authorization remains
  separately Owner-controlled and requires explicit grant after Story Fixture human review completion.
